<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#111111">
<title>My Orders | YUNO</title>
<style>
:root{--black:#111;--white:#fff;--paper:#f4f4f2;--muted:#777;--line:#e5e5e2;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--black);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.topbar{min-height:76px;padding:0 5.5%;display:flex;align-items:center;justify-content:space-between;gap:24px;background:var(--black);color:#fff}.logo{font-size:36px;font-weight:900;letter-spacing:9px}.nav{display:flex;gap:28px;align-items:center;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.page{width:min(1120px,89%);margin:58px auto 90px}.eyebrow{margin:0 0 12px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase}h1{margin:0;font-size:clamp(34px,5vw,54px);line-height:1;font-weight:900;letter-spacing:-2px;text-transform:uppercase}.intro{margin:14px 0 32px;color:#666;font-size:16px;line-height:1.6}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px}.summary-card{padding:21px 23px;background:#fff;border:1px solid var(--line)}.summary-card span{display:block;margin-bottom:9px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}.summary-card strong{font-size:27px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.toolbar h2{margin:0;font-size:21px;font-weight:900;text-transform:uppercase}.filters{display:flex;flex-wrap:wrap;gap:8px}.filter-btn{padding:10px 14px;border:1px solid #d7d7d3;background:transparent;color:#333;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}.filter-btn.active,.filter-btn:hover{background:#111;border-color:#111;color:#fff}.message{display:none;margin:18px 0;padding:16px 18px;background:#fff;border:1px solid var(--line);line-height:1.5}.message.show{display:block}.message.error{border-left:4px solid var(--red)}.orders-list{display:grid;gap:16px}.order-card{padding:23px 25px;background:#fff;border:1px solid var(--line)}.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding-bottom:17px;border-bottom:1px solid var(--line)}.order-number{margin:0 0 7px;font-size:17px;font-weight:900}.order-date{color:var(--muted);font-size:13px}.status{display:inline-flex;align-items:center;min-height:29px;padding:6px 11px;background:#f1f1ef;color:#444;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}.status.pending{background:#fff3d9;color:#875600}.status.confirmed{background:#e8f0ff;color:#2456a6}.status.processing{background:#eee9ff;color:#6243a5}.status.shipped{background:#e4f3f6;color:#17677a}.status.delivered{background:#e5f5e9;color:#176b32}.status.cancelled{background:#fde9e7;color:#a3261d}.order-body{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;padding:19px 0}.order-meta{display:flex;flex-wrap:wrap;gap:10px 25px;color:#666;font-size:13px}.order-meta strong{color:#111}.total-label{margin-bottom:5px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1px;text-align:right;text-transform:uppercase}.total-value{font-size:21px;font-weight:900;white-space:nowrap}.order-foot{display:flex;justify-content:flex-end;padding-top:15px;border-top:1px solid var(--line)}.btn{display:inline-flex;justify-content:center;align-items:center;min-height:43px;padding:0 19px;border:1px solid #111;background:#111;color:#fff;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.btn:hover{background:#fff;color:#111}.empty,.loading{padding:50px 20px;background:#fff;border:1px solid var(--line);text-align:center}.empty h3{margin:0 0 9px;font-size:22px}.empty p{margin:0 0 22px;color:var(--muted);line-height:1.5}.loading{color:var(--muted)}.modal-backdrop{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.65)}.modal-backdrop.open{display:flex}.modal{width:min(720px,100%);max-height:88vh;overflow-y:auto;background:#fff}.modal-header{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:19px 23px;border-bottom:1px solid var(--line);background:#fff}.modal-header h2{margin:0;font-size:20px}.close-btn{width:35px;height:35px;border:0;background:transparent;font-size:27px}.modal-content{padding:23px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:17px;margin-bottom:22px}.detail-field{padding-bottom:12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.detail-field span{display:block;margin-bottom:6px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}.detail-field strong{font-size:14px}.section-title{margin:25px 0 12px;font-size:14px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.item-row{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}.item-row strong{display:block;margin-bottom:5px}.item-row small{color:var(--muted);line-height:1.5}.item-price{font-weight:800;white-space:nowrap}.totals{margin-top:18px}.total-line{display:flex;justify-content:space-between;gap:15px;padding:7px 0;color:#555;font-size:14px}.total-line.grand{margin-top:5px;padding-top:14px;border-top:1px solid var(--line);color:#111;font-size:18px;font-weight:900}

/* CUSTOMER ORDER TRACKING */
.tracking {
    margin: 4px 0 18px;
    padding: 18px 16px 15px;
    background: #fafaf9;
    border: 1px solid var(--line);
}
.tracking-title {
    margin: 0 0 17px;
    color: #666;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.2px;
    text-transform: uppercase;
}
.tracking-steps {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    position: relative;
    gap: 5px;
}
.tracking-step {
    position: relative;
    z-index: 1;
    min-width: 0;
    text-align: center;
}
.tracking-step:not(:last-child)::after {
    content: "";
    position: absolute;
    top: 10px;
    left: calc(50% + 12px);
    width: calc(100% - 19px);
    height: 2px;
    background: #d8d8d4;
}
.tracking-step.completed:not(:last-child)::after {
    background: #111;
}
.tracking-dot {
    display: block;
    width: 21px;
    height: 21px;
    margin: 0 auto 9px;
    border: 2px solid #c9c9c4;
    border-radius: 50%;
    background: #fff;
}
.tracking-step.completed .tracking-dot,
.tracking-step.current .tracking-dot {
    border-color: #111;
    background: #111;
    box-shadow: inset 0 0 0 4px #fff;
}
.tracking-step.current .tracking-dot {
    box-shadow: 0 0 0 4px #e5e5e2, inset 0 0 0 4px #fff;
}
.tracking-step span {
    display: block;
    color: #888;
    font-size: 10px;
    font-weight: 800;
    line-height: 1.35;
    overflow-wrap: anywhere;
}
.tracking-step.completed span,
.tracking-step.current span {
    color: #111;
}
.tracking-cancelled {
    padding: 13px 15px;
    border-left: 4px solid var(--red);
    background: #fff0ee;
    color: #9d241b;
    font-size: 13px;
    font-weight: 800;
}
.tracking-note {
    margin: 13px 0 0;
    color: #777;
    font-size: 12px;
    line-height: 1.5;
}
@media(max-width: 480px) {
    .tracking { padding: 15px 9px 12px; }
    .tracking-steps { gap: 1px; }
    .tracking-step span { font-size: 9px; }
    .tracking-step:not(:last-child)::after {
        left: calc(50% + 10px);
        width: calc(100% - 15px);
    }
}

@media(max-width:700px){.topbar{min-height:68px;padding:0 5%}.logo{font-size:27px;letter-spacing:6px}.nav{gap:13px;font-size:10px}.page{width:90%;margin-top:38px}.summary-grid{grid-template-columns:1fr;gap:9px}.summary-card{padding:16px 18px}.summary-card strong{font-size:23px}.toolbar{align-items:flex-start;flex-direction:column}.filters{gap:6px}.filter-btn{padding:9px 10px;font-size:10px}.order-card{padding:18px}.order-body{grid-template-columns:1fr}.total-label,.total-value{text-align:left}.order-foot{justify-content:stretch}.order-foot .btn{width:100%}}@media(max-width:430px){.nav{gap:9px}.logo{font-size:23px;letter-spacing:4px}.order-head{flex-direction:column}.detail-grid{grid-template-columns:1fr}.item-row{flex-direction:column}}
</style></head>
<body>
<header class="topbar"><a class="logo" href="/index.html">YUNO</a><nav class="nav" aria-label="Main navigation"><a href="/index.html">Shop</a><a href="/profile.html">My Account</a><a href="#" id="logoutLink">Logout</a></nav></header>
<main class="page"><p class="eyebrow">Your YUNO account</p><h1>My Orders</h1><p class="intro">Track your purchases, check order details and stay updated on your YUNO orders.</p>
<section class="summary-grid" aria-label="Order summary"><div class="summary-card"><span>Total Orders</span><strong id="totalOrders">—</strong></div><div class="summary-card"><span>Active Orders</span><strong id="activeOrders">—</strong></div><div class="summary-card"><span>Total Spending</span><strong id="totalSpending">—</strong></div></section>
<div id="pageMessage" class="message" role="alert"></div>
<section><div class="toolbar"><h2>Order History</h2><div class="filters" id="filters" aria-label="Filter orders"><button class="filter-btn active" data-filter="all" type="button">All</button><button class="filter-btn" data-filter="pending" type="button">Pending</button><button class="filter-btn" data-filter="confirmed" type="button">Confirmed</button><button class="filter-btn" data-filter="processing" type="button">Processing</button><button class="filter-btn" data-filter="shipped" type="button">Shipped</button><button class="filter-btn" data-filter="delivered" type="button">Delivered</button></div></div><div id="ordersList" class="orders-list"><div class="loading">Loading your orders...</div></div></section></main>
<div class="modal-backdrop" id="detailsModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-header"><h2 id="modalTitle">Order Details</h2><button class="close-btn" id="closeModal" type="button" aria-label="Close">&times;</button></div><div class="modal-content" id="modalContent"><div class="loading">Loading order details...</div></div></div></div>
<script>
const API_BASE="/api/orders",ordersList=document.getElementById("ordersList"),pageMessage=document.getElementById("pageMessage"),modal=document.getElementById("detailsModal"),modalContent=document.getElementById("modalContent");let allOrders=[],activeFilter="all";
function formatMoney(value){return new Intl.NumberFormat("en-US",{maximumFractionDigits:0}).format(Number(value||0))+" MMK"}
function formatDate(value){if(!value)return"Date unavailable";const date=new Date(value);return Number.isNaN(date.getTime())?String(value):date.toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function statusClass(status){const value=String(status||"").toLowerCase();return["pending","confirmed","processing","shipped","delivered","cancelled"].includes(value)?value:""}
function showMessage(message,type){pageMessage.textContent=message;pageMessage.className="message show "+(type||"info")}
async function apiRequest(url){const response=await fetch(url,{credentials:"same-origin",headers:{Accept:"application/json"}});if(response.status===401||response.status===403){window.location.href="/login.html";throw new Error("Please log in to view your orders.")}const contentType=response.headers.get("content-type")||"";const data=contentType.includes("application/json")?await response.json():await response.text();if(!response.ok)throw new Error(typeof data==="string"?data:(data.message||data.title||"The request could not be completed."));return data}
function renderSummary(){document.getElementById("totalOrders").textContent=allOrders.length;document.getElementById("activeOrders").textContent=allOrders.filter(o=>!["delivered","cancelled"].includes(String(o.orderStatus||"").toLowerCase())).length;document.getElementById("totalSpending").textContent=formatMoney(allOrders.reduce((sum,o)=>sum+Number(o.totalAmount||0),0))}
function renderTracking(status) {
    const stages = ["Pending", "Confirmed", "Processing", "Shipped", "Delivered"];
    const normalized = String(status || "").toLowerCase();

    if (normalized === "cancelled") {
        return `<div class="tracking">
            <p class="tracking-title">Order progress</p>
            <div class="tracking-cancelled">This order has been cancelled.</div>
        </div>`;
    }

    const currentIndex = stages.findIndex(
        stage => stage.toLowerCase() === normalized
    );
    const safeIndex = currentIndex < 0 ? 0 : currentIndex;

    const steps = stages.map((stage, index) => {
        const stateClass = index < safeIndex
            ? "completed"
            : index === safeIndex
                ? "current"
                : "";

        const marker = index < safeIndex ? "✓" : index + 1;

        return `<div class="tracking-step ${stateClass}">
            <span class="tracking-dot" aria-label="${marker}"></span>
            <span>${stage}</span>
        </div>`;
    }).join("");

    return `<div class="tracking">
        <p class="tracking-title">Order progress</p>
        <div class="tracking-steps" aria-label="Order status: ${escapeHtml(status)}">
            ${steps}
        </div>
        <p class="tracking-note">Current stage: <strong>${escapeHtml(status)}</strong>. The progress updates when YUNO changes your order status.</p>
    </div>`;
}

function renderOrders(){
    const filtered = activeFilter === "all"
        ? allOrders
        : allOrders.filter(o => String(o.orderStatus || "").toLowerCase() === activeFilter);

    if (!filtered.length) {
        ordersList.innerHTML = `<div class="empty">
            <h3>No orders found</h3>
            <p>${allOrders.length ? "There are no orders in this status." : "You have not placed any orders yet."}</p>
            <a class="btn" href="/index.html">Shop Collection</a>
        </div>`;
        return;
    }

    ordersList.innerHTML = filtered.map(o => {
        const status = String(o.orderStatus || "Unknown");

        return `<article class="order-card">
            <div class="order-head">
                <div>
                    <p class="order-number">ORDER #${escapeHtml(o.orderId)}</p>
                    <div class="order-date">Placed on ${escapeHtml(formatDate(o.createdAt))}</div>
                </div>
                <span class="status ${statusClass(status)}">${escapeHtml(status)}</span>
            </div>

            <div class="order-body">
                <div class="order-meta">
                    <span>Customer: <strong>${escapeHtml(o.fullName || "Customer")}</strong></span>
                    <span>Payment: <strong>${escapeHtml(o.paymentMethod || "—")}</strong></span>
                </div>
                <div>
                    <div class="total-label">Order total</div>
                    <div class="total-value">${formatMoney(o.totalAmount)}</div>
                </div>
            </div>

            ${renderTracking(status)}

            <div class="order-foot">
                <button class="btn view-details" type="button"
                        data-order-id="${escapeHtml(o.orderId)}">View Details</button>
            </div>
        </article>`;
    }).join("");
}
async function loadOrders(){ordersList.innerHTML='<div class="loading">Loading your orders...</div>';pageMessage.className="message";try{const data=await apiRequest(API_BASE+"/my-orders");allOrders=Array.isArray(data)?data:[];renderSummary();renderOrders()}catch(error){ordersList.innerHTML=`<div class="empty"><h3>Unable to load orders</h3><p>${escapeHtml(error.message)}</p><button class="btn" type="button" id="retryButton">Try Again</button></div>`;showMessage(error.message,"error");document.getElementById("retryButton")?.addEventListener("click",loadOrders)}}
function field(label,value){return`<div class="detail-field"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value??"—")}</strong></div>`}
async function showOrderDetails(orderId){modal.classList.add("open");document.body.style.overflow="hidden";modalContent.innerHTML='<div class="loading">Loading order details...</div>';try{const data=await apiRequest(`${API_BASE}/${encodeURIComponent(orderId)}`),o=data.order||{},items=Array.isArray(data.items)?data.items:[];const itemHtml=items.length?items.map(i=>`<div class="item-row"><div><strong>${escapeHtml(i.productName)}</strong><small>Quantity: ${escapeHtml(i.quantity)} · Size: ${escapeHtml(i.size||"—")} · Color: ${escapeHtml(i.color||"—")}</small></div><div class="item-price">${formatMoney(i.subtotal)}</div></div>`).join(""):'<p>No product details were returned for this order.</p>';modalContent.innerHTML=`<div class="detail-grid">${field("Order ID","#"+o.orderId)}${field("Order Status",o.orderStatus)}${field("Order Date",formatDate(o.createdAt))}${field("Payment Method",o.paymentMethod)}${field("Full Name",o.fullName)}${field("Phone",o.phone)}${field("Delivery Address",o.deliveryAddress)}${field("Order Note",o.orderNote||"No note")}</div><h3 class="section-title">Items Ordered</h3>${itemHtml}<div class="totals"><div class="total-line"><span>Subtotal</span><strong>${formatMoney(o.subtotal)}</strong></div><div class="total-line"><span>Delivery Fee</span><strong>${formatMoney(o.deliveryFee)}</strong></div><div class="total-line grand"><span>Total</span><strong>${formatMoney(o.totalAmount)}</strong></div></div>`}catch(error){modalContent.innerHTML=`<div class="message show error">${escapeHtml(error.message)}</div>`}}
document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;activeFilter=b.dataset.filter;document.querySelectorAll(".filter-btn").forEach(x=>x.classList.toggle("active",x===b));renderOrders()});ordersList.addEventListener("click",e=>{const b=e.target.closest(".view-details");if(b)showOrderDetails(b.dataset.orderId)});
function closeModal(){modal.classList.remove("open");document.body.style.overflow=""}document.getElementById("closeModal").addEventListener("click",closeModal);modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
document.getElementById("logoutLink").addEventListener("click",async e=>{e.preventDefault();try{await fetch("/api/customers/logout",{method:"POST",credentials:"same-origin",headers:{Accept:"application/json"}})}finally{window.location.href="/login.html"}});loadOrders();
</script></body></html>
